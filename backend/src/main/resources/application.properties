spring.application.name=taskflow-api
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:taskflow;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
taskflow.jwt-secret=${TASKFLOW_JWT_SECRET:taskflow-local-development-secret-change-before-deploy-2026}
taskflow.admin-password=${TASKFLOW_ADMIN_PASSWORD:admin123!}
taskflow.member-password=${TASKFLOW_MEMBER_PASSWORD:member123!}
taskflow.viewer-password=${TASKFLOW_VIEWER_PASSWORD:viewer123!}
taskflow.jwt-expiration-hours=${TASKFLOW_JWT_EXPIRATION_HOURS:12}
spring.flyway.enabled=true
